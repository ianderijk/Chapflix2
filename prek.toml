exclude = "^tests/backend/*"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "ruff-format",
        name = "Ruff formatting",
        entry = "uv",
        args = ["run", "ruff", "format"],
        language = "system",
        types = ["python"]
    },

    {
        id = "ruff-lint",
        name = "Ruff linting",
        entry = "uv",
        args = ["run", "ruff", "check", "--fix"],
        language = "system",
        types = ["python"]
    },

    {
        id = "ty-type-check",
        name = "Type checking",
        entry = "uv",
        args = ["run", "ty", "check"],
        language = "system",
        types = ["python"]
    },

    {
        id = "frontend-lint",
        name = "Frontend linting and formatting",
        entry = "npm",
        args = ["--prefix", "app", "run", "lint"],
        language = "system",
        files = "^app/(assets/|.*\\.(js|json)$)",
        pass_filenames = false
    },

    {
        id = "frontend-js-tests",
        name = "Frontend JavaScript tests",
        entry = "npm",
        args = ["--prefix", "app", "test"],
        language = "system",
        files = "^app/assets/.*\\.js$",
        pass_filenames = false
    }
]
